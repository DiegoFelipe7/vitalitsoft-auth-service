server:
  port: ${SERVER_PORT}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:query.sql
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
adapters:
  r2dbc:
    host: ${R2DBC_HOST}
    port: ${R2DBC_PORT}
    database: ${R2DBC_DATABASE}
    schema: ${R2DBC_SCHEMA}
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
      header: ${JWT_HEADER}
      prefix: ${JWT_PREFIX}
      refresh_expiration: ${JWT_EXPIRATION_REFRESH_TOKEN}
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    virtual-host: ${RABBIT_VIRTUAL_HOST}
    connection-timeout: ${RABBIT_CONNECTION_TIMEOUT}
    exchanges:
      - "vitalitsoft.auth.events"
      - "vitalitsoft.user.events"
    routing-keys:
      - "user.created.v1"
      - "user.login.v1"
      - "password.reset.requested.v1"
    queues:
      - "queue.auth.v1"
      - "queue.user.v1"
    #bindings:
     # - exchange: "vitalitsoft.auth.events"
     #   routingKey: "user.created.v1"
     #   queue: "queue.auth.v1"
      #- exchange: "vitalitsoft.auth.events"
     ##   routingKey: "password.reset.requested.v1"
       # queue: "queue.auth.v1"
    bindings:
      USER_CREATED:
        exchange: "vitalitsoft.auth.events"
        routingKey: "user.created.v1"
        queue: "queue.auth.v1"
      USER_PASSWORD_RESET:
        exchange: "vitalitsoft.auth.events"
        routingKey: "password.reset.requested.v1"
        queue: "queue.auth.v1"




